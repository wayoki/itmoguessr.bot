name: Prepare Telegram videos

on:
  workflow_dispatch:
  schedule:
    - cron: '7,22,37,52 * * * *'

permissions:
  contents: read

concurrency:
  group: itmoguessr-media
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      ITMOGUESSR_MEDIA_ORIGIN: https://itmoguessr-training-bot.handydandelion1.chatgpt.site
      ITMOGUESSR_MEDIA_KEY: ${{ secrets.ITMOGUESSR_MEDIA_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Report setup blocker
        if: env.ITMOGUESSR_MEDIA_KEY == ''
        run: |
          echo '::warning::Video preparation is inactive. Add the ITMOGUESSR_MEDIA_KEY repository secret.'
          echo '## Not active: repository secret ITMOGUESSR_MEDIA_KEY is missing' >> "$GITHUB_STEP_SUMMARY"
      - name: Verify private media access
        if: env.ITMOGUESSR_MEDIA_KEY != '' || github.event_name == 'workflow_dispatch'
        run: python scripts/check_schedule.py --verify
      - name: Install FFmpeg
        if: env.ITMOGUESSR_MEDIA_KEY != ''
        run: |
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends ffmpeg
          fi
      - name: Prepare private Drive media
        if: env.ITMOGUESSR_MEDIA_KEY != ''
        run: python scripts/cloud_prepare.py

