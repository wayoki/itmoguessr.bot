name: Check training schedule

on:
  workflow_dispatch:
  schedule:
    - cron: '2-57/5 * * * *'

permissions:
  contents: read

concurrency:
  group: itmoguessr-training-schedule
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      ITMOGUESSR_MEDIA_ORIGIN: https://itmoguessr-training-bot.handydandelion1.chatgpt.site
      ITMOGUESSR_MEDIA_KEY: ${{ secrets.ITMOGUESSR_MEDIA_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Report setup blocker
        if: env.ITMOGUESSR_MEDIA_KEY == ''
        run: |
          echo '::warning::Maintenance is inactive. Add the ITMOGUESSR_MEDIA_KEY repository secret.'
          echo '## Not active: repository secret ITMOGUESSR_MEDIA_KEY is missing' >> "$GITHUB_STEP_SUMMARY"
      - name: Close and publish due rounds and reports
        if: env.ITMOGUESSR_MEDIA_KEY != '' || github.event_name == 'workflow_dispatch'
        run: python scripts/check_schedule.py

