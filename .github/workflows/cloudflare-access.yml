name: Verify Cloudflare access

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/cloudflare-access.yml']

permissions:
  contents: read

jobs:
  verify:
    environment: itmoguessrbot
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check destination permissions
        env:
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          node --input-type=module <<'JS'
          const account = process.env.CF_ACCOUNT;
          const token = process.env.CF_TOKEN;
          if (!/^[a-f0-9]{32}$/i.test(account ?? '') || !token) throw new Error('Cloudflare environment secrets are missing or invalid');
          for (const [label, path] of [['Workers', 'workers/scripts'], ['D1', 'd1/database'], ['R2', 'r2/buckets']]) {
            const response = await fetch('https://api.cloudflare.com/client/v4/accounts/' + account + '/' + path, {
              headers: { Authorization: 'Bearer ' + token },
              signal: AbortSignal.timeout(30000),
            });
            const data = await response.json();
            if (!response.ok || data.success === false) {
              console.error(label + ' access failed: HTTP ' + response.status + '; API codes: ' + (data.errors ?? []).map(e => e.code).join(','));
              process.exit(1);
            }
            const items = Array.isArray(data.result) ? data.result : (data.result?.buckets ?? []);
            console.log(label + ' access verified; existing resources: ' + items.length);
          }
          JS
