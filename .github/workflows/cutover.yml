name: Verify Actions cutover

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/cutover.yml

permissions:
  contents: read

concurrency:
  group: itmoguessr-media
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ITMOGUESSR_MEDIA_ORIGIN: https://itmoguessr-training-bot.handydandelion1.chatgpt.site
      ITMOGUESSR_MEDIA_KEY: ${{ secrets.ITMOGUESSR_MEDIA_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify authenticated private media access
        run: python scripts/check_schedule.py --verify
      - name: Install FFmpeg
        run: |
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends ffmpeg
          fi
      - name: Process private video queue
        run: python scripts/cloud_prepare.py
      - name: Check due rounds and reports
        run: python scripts/check_schedule.py
